<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Officer Dashboard — Livelihood Skilling Assistant</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{--navy:#0B2447;--saffron:#FF9933;--green:#138808;--bg:#f4f6fa;--muted:#6b7684;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:#1c2733;}
  header{background:var(--navy);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  header h1{font-size:1.1rem;margin:0;}
  nav a{color:#fff;text-decoration:none;background:rgba(255,255,255,.12);padding:8px 14px;border-radius:20px;font-size:.85rem;}
  main{max-width:1000px;margin:24px auto;padding:0 16px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
  .stat-card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .stat-card .num{font-size:1.8rem;font-weight:700;color:var(--navy);}
  .stat-card .label{color:var(--muted);font-size:.85rem;}
  .card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:20px;}
  table{width:100%;border-collapse:collapse;font-size:.85rem;}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #eef1f5;}
  th{color:var(--muted);font-weight:600;}
  .tag{display:inline-block;background:#eef1f5;padding:2px 8px;border-radius:10px;font-size:.75rem;margin:2px;}
  canvas{max-height:320px;}
  @media (max-width:700px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <h1>📊 Officer Dashboard — PM-AJAY Skilling Recommendations</h1>
  <nav><a href="/">← Back to Assistant</a></nav>
</header>
<main>
  <div class="grid">
    <div class="stat-card"><div class="num" id="totalSessions">–</div><div class="label">Total Beneficiary Sessions</div></div>
    <div class="stat-card"><div class="num" id="topTrade">–</div><div class="label">Most Recommended Trade</div></div>
  </div>

  <div class="card">
    <h3>Trade Recommendation Frequency</h3>
    <canvas id="tradeChart"></canvas>
  </div>

  <div class="card">
    <h3>Session Log</h3>
    <table id="sessionTable">
      <thead><tr><th>ID</th><th>Time</th><th>Lang</th><th>Profile Summary</th><th>Top Recommendation</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>
<script>
async function loadDashboard() {
  const [sessionsRes, countsRes] = await Promise.all([
    fetch("/api/dashboard/sessions"), fetch("/api/dashboard/trade_counts")
  ]);
  const sessions = await sessionsRes.json();
  const counts = await countsRes.json();

  document.getElementById("totalSessions").textContent = sessions.length;
  const topEntry = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById("topTrade").textContent = topEntry ? topEntry[0] : "—";

  const ctx = document.getElementById("tradeChart");
  new Chart(ctx, {
    type: "bar",
    data: {
      labels: Object.keys(counts),
      datasets: [{ label: "Times Recommended (Top Pick)", data: Object.values(counts), backgroundColor: "#FF9933" }]
    },
    options: { responsive: true, plugins: { legend: { display: false } } }
  });

  const tbody = document.querySelector("#sessionTable tbody");
  tbody.innerHTML = "";
  sessions.forEach(s => {
    const profileSummary = Object.entries(s.profile).map(([k,v]) => `<span class="tag">${k}: ${v}</span>`).join(" ");
    const topRec = s.recommendations && s.recommendations[0] ? s.recommendations[0].trade_name : "—";
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${s.id}</td><td>${new Date(s.timestamp).toLocaleString()}</td><td>${s.language}</td><td>${profileSummary}</td><td>${topRec}</td>`;
    tbody.appendChild(tr);
  });
}
loadDashboard();
</script>
</body>
</html>
